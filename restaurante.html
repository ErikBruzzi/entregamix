<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>EntregaMix · Painel do restaurante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red:#D6202A; --red-dark:#A81620; --green:#167A46; --green-dark:#0F5C34;
    --ink:#171717; --ink-soft:#6B6B6B; --line:#ECECEC; --bg:#FFFFFF; --surface:#F7F7F7; --radius:14px;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; }
  h1,h2,h3,.brand { font-family:'Sora',sans-serif; }
  button { font-family:inherit; cursor:pointer; border:none; }
  input, textarea, select { font-family:inherit; }

  #app { max-width:560px; margin:0 auto; min-height:100vh; padding-bottom:40px; }
  .topbar { background:var(--ink); color:#fff; padding:18px 20px 16px; }
  .topbar-stripe { height:4px; display:flex; margin:-18px -20px 14px; }
  .topbar-stripe span { flex:1; }
  .topbar-stripe span:nth-child(1){background:var(--red);}
  .topbar-stripe span:nth-child(2){background:#fff;}
  .topbar-stripe span:nth-child(3){background:var(--green);}
  .brand { font-size:19px; font-weight:800; }
  .brand span { color:var(--red); }
  .topbar-sub { font-size:13px; color:#cfcfcf; margin-top:2px; }
  a.back-link { color:#cfcfcf; font-size:13px; text-decoration:none; }

  .content { padding:20px; }
  .tabs { display:flex; gap:8px; margin-bottom:20px; border-bottom:1px solid var(--line); overflow-x:auto; }
  .tab-btn { background:none; padding:10px 4px; font-weight:700; font-size:14px; color:var(--ink-soft); border-bottom:2px solid transparent; white-space:nowrap; }
  .tab-btn.active { color:var(--ink); border-color:var(--red); }
  .panel { display:none; }
  .panel.active { display:block; animation:fade .2s ease; }
  @keyframes fade { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .field { margin-bottom:14px; }
  .field label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--ink-soft); }
  .field input, .field textarea { width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:10px; font-size:15px; outline:none; }
  .field input:focus, .field textarea:focus { border-color:var(--green); }
  .field-row { display:flex; gap:10px; }
  .field-row .field { flex:1; }

  .primary-btn { background:var(--red); color:#fff; padding:14px 22px; border-radius:12px; font-weight:700; font-size:14px; }
  .primary-btn.green { background:var(--green); }
  .primary-btn.ink { background:var(--ink); }
  .secondary-btn { background:var(--surface); color:var(--ink); padding:10px 16px; border-radius:10px; font-weight:600; font-size:13px; }
  .save-msg { font-size:13px; color:var(--green-dark); margin-top:10px; display:none; }
  .error-msg { font-size:13px; color:var(--red-dark); margin-top:10px; display:none; }

  .menu-item-card { border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px; }
  .menu-item-card .row { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .menu-item-card .name { font-weight:700; font-size:15px; }
  .menu-item-card .desc { font-size:13px; color:var(--ink-soft); margin-top:2px; }
  .menu-item-card .price { font-weight:700; font-size:14px; white-space:nowrap; }
  .menu-item-card .actions { display:flex; gap:8px; margin-top:10px; }
  .badge-unavailable { font-size:11px; background:#FFE3D6; color:var(--red-dark); padding:2px 8px; border-radius:20px; margin-left:8px; }

  .order-card { border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px; }
  .order-card .row { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .status-badge { font-size:12px; font-weight:700; padding:4px 10px; border-radius:20px; }
  .status-recebido{background:#FFF1D6;color:#A66B00;}
  .status-preparando{background:#FFE3D6;color:var(--red-dark);}
  .status-pronto{background:#EAE1FF;color:#5B34C9;}
  .status-a_caminho{background:#DCE9FF;color:#1B4FA8;}
  .status-entregue{background:#DFF3E7;color:var(--green-dark);}
  .status-cancelado{background:#EEE;color:#777;}
  .order-items { margin:8px 0; font-size:13px; color:var(--ink-soft); }
  .order-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .pickup-code { background:var(--surface); border-radius:10px; padding:8px 12px; font-size:13px; margin-top:8px; }
  .empty-state { text-align:center; padding:50px 20px; color:var(--ink-soft); }

  .login-gate { padding:60px 20px; text-align:center; }
  .login-gate .field { text-align:left; max-width:320px; margin:0 auto 14px; }
  .toggle-row { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="topbar-stripe"><span></span><span></span><span></span></div>
    <a class="back-link" href="index.html">← Voltar ao app</a>
    <div class="brand" style="margin-top:6px;">Entrega<span>Mix</span> · Restaurante</div>
    <div class="topbar-sub">Painel de gestão do seu estabelecimento</div>
  </div>

  <div class="login-gate" id="loginGate">
    <h2 id="gateTitle">Entre na sua conta de restaurante</h2>
    <form id="loginForm">
      <div class="field" id="gateFieldName" style="display:none;"><label>Nome do responsável</label><input type="text" id="gateName" /></div>
      <div class="field"><label>E-mail</label><input type="email" id="gateEmail" required /></div>
      <div class="field"><label>Senha</label><input type="password" id="gatePassword" required minlength="6" /></div>
      <button class="primary-btn" type="submit" id="gateSubmit">Entrar</button>
    </form>
    <p class="error-msg" id="gateError"></p>
    <p style="font-size:14px; color:var(--ink-soft); margin-top:16px;">
      <span id="gateSwitchText">Ainda não tem conta de restaurante?</span> <a href="#" id="gateSwitchLink" style="color:var(--green); font-weight:600; text-decoration:none;">Criar conta</a>
    </p>
  </div>

  <div class="content" id="dashboardContent" style="display:none;">
    <div class="tabs">
      <button class="tab-btn active" data-tab="settings">Meu restaurante</button>
      <button class="tab-btn" data-tab="menu">Cardápio</button>
      <button class="tab-btn" data-tab="orders">Pedidos</button>
    </div>

    <div class="panel active" id="panel-settings">
      <form id="settingsForm">
        <div class="field"><label>Nome do restaurante</label><input type="text" id="settName" required /></div>
        <div class="field"><label>Categoria</label><input type="text" id="settCategory" placeholder="Ex: Pizzas, Brasileira, Sobremesas" /></div>
        <div class="field"><label>Endereço de retirada (onde o entregador busca o pedido)</label><input type="text" id="settAddress" placeholder="Rua, número, bairro, cidade" required /></div>
        <div class="field-row">
          <div class="field"><label>Tempo médio de entrega (min)</label><input type="number" id="settEta" min="5" required /></div>
          <div class="field"><label>Taxa de entrega (R$)</label><input type="number" id="settFee" min="0" step="0.01" required /></div>
        </div>
        <div class="toggle-row">
          <input type="checkbox" id="settActive" style="width:18px; height:18px;" />
          <label for="settActive" style="font-size:14px;">Restaurante visível e recebendo pedidos</label>
        </div>
        <button type="submit" class="primary-btn green">Salvar alterações</button>
        <div class="save-msg" id="settSaveMsg">Dados atualizados com sucesso.</div>
      </form>
      <button class="primary-btn ink" style="margin-top:24px;" id="logoutBtn">Sair da conta</button>
    </div>

    <div class="panel" id="panel-menu">
      <div style="margin-bottom:18px;">
        <div class="field"><label>Nome do prato</label><input type="text" id="newItemName" /></div>
        <div class="field"><label>Descrição (opcional)</label><input type="text" id="newItemDesc" /></div>
        <div class="field-row">
          <div class="field"><label>Preço (R$)</label><input type="number" id="newItemPrice" min="0" step="0.01" /></div>
        </div>
        <button class="primary-btn" id="addItemBtn">Adicionar prato</button>
      </div>
      <div id="menuList"></div>
    </div>

    <div class="panel" id="panel-orders">
      <div id="ordersList"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="db-adapter.js"></script>
<script src="restaurante.js"></script>
</body>
</html>
