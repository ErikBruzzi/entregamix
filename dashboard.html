<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>EntregaMix · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #D6202A; --red-dark: #A81620; --green: #167A46; --green-dark: #0F5C34;
    --ink: #171717; --ink-soft: #6B6B6B; --line: #ECECEC; --bg: #FFFFFF; --surface: #F7F7F7; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:'Inter', sans-serif; }
  h1, h2, h3, .brand { font-family:'Sora', sans-serif; }
  button { font-family:inherit; cursor:pointer; border:none; }
  input { font-family:inherit; }

  #app { max-width: 520px; margin:0 auto; min-height:100vh; padding-bottom: 40px; }
  .topbar { background: var(--ink); color:#fff; padding: 18px 20px 16px; }
  .topbar-stripe { height:4px; display:flex; margin:-18px -20px 14px; }
  .topbar-stripe span { flex:1; }
  .topbar-stripe span:nth-child(1){background:var(--red);}
  .topbar-stripe span:nth-child(2){background:#fff;}
  .topbar-stripe span:nth-child(3){background:var(--green);}
  .brand { font-size:19px; font-weight:800; }
  .brand span { color: var(--green); }
  .topbar-sub { font-size:13px; color:#cfcfcf; margin-top:2px; }
  a.back-link { color:#cfcfcf; font-size:13px; text-decoration:none; }

  .content { padding: 20px; }
  .tabs { display:flex; gap:8px; margin-bottom:20px; border-bottom:1px solid var(--line); }
  .tab-btn { background:none; padding:10px 4px; font-weight:700; font-size:14px; color:var(--ink-soft); border-bottom:2px solid transparent; }
  .tab-btn.active { color:var(--ink); border-color: var(--red); }

  .panel { display:none; }
  .panel.active { display:block; animation: fade .2s ease; }
  @keyframes fade { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .field { margin-bottom:14px; }
  .field label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--ink-soft); }
  .field input { width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:10px; font-size:15px; outline:none; }
  .field input:focus { border-color: var(--green); }
  .field input:disabled { background: var(--surface); color: var(--ink-soft); }

  .primary-btn { background:var(--red); color:#fff; padding:14px 22px; border-radius:12px; font-weight:700; font-size:14px; }
  .primary-btn.green { background: var(--green); }
  .save-msg { font-size:13px; color: var(--green-dark); margin-top:10px; display:none; }

  .order-card { border:1px solid var(--line); border-radius: var(--radius); padding:14px; margin-bottom:12px; }
  .order-card .row { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .status-badge { font-size:12px; font-weight:700; padding:4px 10px; border-radius:20px; }
  .status-recebido{background:#FFF1D6;color:#A66B00;}
  .status-preparando{background:#FFE3D6;color:var(--red-dark);}
  .status-a_caminho{background:#DCE9FF;color:#1B4FA8;}
  .status-entregue{background:#DFF3E7;color:var(--green-dark);}
  .order-items { margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:13px; color:var(--ink-soft); }
  .empty-state { text-align:center; padding:60px 20px; color:var(--ink-soft); }

  .login-gate { padding: 60px 20px; text-align:center; }
  .login-gate .field { text-align:left; max-width:320px; margin:0 auto 14px; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="topbar-stripe"><span></span><span></span><span></span></div>
    <a class="back-link" href="index.html">← Voltar ao app</a>
    <div class="brand" style="margin-top:6px;">Entrega<span>Mix</span> · Dashboard</div>
    <div class="topbar-sub">Configurações de conta e pedidos</div>
  </div>

  <!-- Bloqueio de acesso caso não esteja logado -->
  <div class="login-gate" id="loginGate">
    <h2 id="gateTitle">Entre para acessar seu dashboard</h2>
    <form id="loginForm">
      <div class="field" id="gateFieldName" style="display:none;"><label>Nome</label><input type="text" id="gateName" /></div>
      <div class="field" id="gateFieldPhone" style="display:none;"><label>Telefone</label><input type="tel" id="gatePhone" /></div>
      <div class="field"><label>E-mail</label><input type="email" id="gateEmail" required /></div>
      <div class="field"><label>Senha</label><input type="password" id="gatePassword" required minlength="6" /></div>
      <button class="primary-btn" type="submit" id="gateSubmit">Entrar</button>
    </form>
    <p class="save-msg" id="gateError" style="display:none; color:var(--red-dark);"></p>
    <p style="font-size:14px; color:var(--ink-soft); margin-top:16px;">
      <span id="gateSwitchText">Ainda não tem conta?</span> <a href="#" id="gateSwitchLink" style="color:var(--green); font-weight:600; text-decoration:none;">Criar conta</a>
    </p>
  </div>

  <div class="content" id="dashboardContent" style="display:none;">
    <div class="tabs">
      <button class="tab-btn active" data-tab="account">Minha conta</button>
      <button class="tab-btn" data-tab="orders">Pedidos</button>
    </div>

    <div class="panel active" id="panel-account">
      <form id="accountForm">
        <div class="field"><label>Nome</label><input type="text" id="accName" /></div>
        <div class="field"><label>E-mail</label><input type="email" id="accEmail" disabled /></div>
        <div class="field"><label>Telefone</label><input type="tel" id="accPhone" /></div>
        <div class="field"><label>Endereço padrão</label><input type="text" id="accAddress" placeholder="Rua, número, bairro, cidade" /></div>
        <button type="submit" class="primary-btn green">Salvar alterações</button>
        <div class="save-msg" id="saveMsg">Dados atualizados com sucesso.</div>
      </form>
      <button class="primary-btn" style="background:var(--ink); margin-top:24px;" id="logoutBtn">Sair da conta</button>
    </div>

    <div class="panel" id="panel-orders">
      <div id="ordersList"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/db-adapter.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
